name: workshop image

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if the depot manifests are unchanged
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      hash: ${{ steps.manifests.outputs.hash }}
      manifest_2347779: ${{ steps.manifests.outputs.manifest_2347779 }}
      manifest_2347771: ${{ steps.manifests.outputs.manifest_2347771 }}
      changed: ${{ steps.registry.outputs.changed }}
    steps:
      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cs2-workshop" >> "$GITHUB_OUTPUT"

      - id: manifests
        env:
          STEAM_USERNAME: ${{ secrets.USERNAME }}
          STEAM_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          set -euo pipefail
          parse() {
            python3 - <<'PY'
          import hashlib, os, re, sys

          text = open("appinfo.txt", encoding="utf-8", errors="replace").read()
          match = re.search(r'^"730"\s*\{', text, re.M)
          if not match:
              sys.exit("app 730 missing from app_info_print output")

          root, key = {}, None
          stack = [root]
          for string, brace in re.findall(r'"((?:[^"\\]|\\.)*)"|([{}])', text[match.start():]):
              if brace == "{":
                  stack[-1][key] = {}
                  stack.append(stack[-1][key])
                  key = None
              elif brace == "}":
                  stack.pop()
                  if len(stack) == 1:
                      break
              elif key is None:
                  key = string
              else:
                  stack[-1][key], key = string, None

          depots = root["730"].get("depots", {})
          values = []
          for depot in ("2347779", "2347771"):
              public = depots.get(depot, {}).get("manifests", {}).get("public")
              gid = public.get("gid") if isinstance(public, dict) else public
              if not gid:
                  sys.exit(f"no public manifest for depot {depot}")
              values.append((depot, gid))

          digest_input = "".join(f"{depot}={gid}\n" for depot, gid in values)
          digest = hashlib.sha256(digest_input.encode()).hexdigest()[:12]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for depot, gid in values:
                  output.write(f"manifest_{depot}={gid}\n")
              output.write(f"hash={digest}\n")
          for depot, gid in values:
              print(f"depot {depot}: manifest {gid}")
          print(f"hash: {digest}")
          PY
          }

          for mode in anonymous account; do
            if [ "$mode" = anonymous ]; then
              login=(anonymous)
            elif [ -n "${STEAM_USERNAME}" ]; then
              login=("${STEAM_USERNAME}" "${STEAM_PASSWORD}")
            else
              break
            fi
            for attempt in 1 2 3; do
              docker run --rm docker.io/steamcmd/steamcmd:latest \
                +login "${login[@]}" \
                +app_info_update 1 \
                +app_info_print 730 \
                +quit > appinfo.txt || true
              if parse; then
                exit 0
              fi
              echo "::warning::${mode} login, attempt ${attempt}: depot manifests not found"
              sleep 10
            done
          done
          echo "::error::could not read public manifests for depots 2347779/2347771"
          exit 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: registry
        env:
          TAG: ${{ steps.image.outputs.image }}:depots-${{ steps.manifests.outputs.hash }}
        run: |
          if docker buildx imagetools inspect "$TAG" > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true' || inputs.force
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # not a check-job output: GitHub drops job outputs containing a secret value (the Steam username equals the owner)
      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cs2-workshop" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.image }}:depots-${{ needs.check.outputs.hash }}
            ${{ steps.image.outputs.image }}:latest
          build-args: |
            MANIFEST_2347779=${{ needs.check.outputs.manifest_2347779 }}
            MANIFEST_2347771=${{ needs.check.outputs.manifest_2347771 }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            cs2.depot.2347779=${{ needs.check.outputs.manifest_2347779 }}
            cs2.depot.2347771=${{ needs.check.outputs.manifest_2347771 }}
          secrets: |
            steam_username=${{ secrets.USERNAME }}
            steam_password=${{ secrets.PASSWORD }}

      - if: always()
        run: df -h /
